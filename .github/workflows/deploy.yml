name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deploy halfway through, but drop stale PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, type check and build
    runs-on: ubuntu-24.04
    outputs:
      build-id: ${{ steps.build-id.outputs.id }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The site lives at the root of devpilotx.me, so no base path is set.
      - name: Build
        run: pnpm build

      # Runs after the build because the build generates the
      # content-collections types that the blog pages import.
      - name: Type check
        run: pnpm typecheck

      - name: Check internal links
        run: pnpm check:links

      - name: Record build ID
        id: build-id
        run: echo "id=$(cat .next/BUILD_ID)" >> "$GITHUB_OUTPUT"

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://devpilotx.me/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Check the live site
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Request the home page and its assets
        run: node scripts/smoke.mjs
        env:
          SITE_URL: https://devpilotx.me
          EXPECTED_BUILD: ${{ needs.build.outputs.build-id }}
